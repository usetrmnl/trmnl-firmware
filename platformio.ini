[platformio]
default_envs = trmnl

;       ========================
;	Third-party Dependencies
;       ========================

; Common dependencies for all environments. DO NOT use caret (^) version specifiers here, 
; as they can cause unexpected updates. Instead, specify exact versions.
[deps_common]
lib_deps =
	bblanchon/ArduinoJson@7.4.2
	bitbank2/PNGdec@1.1.6
	bitbank2/JPEGDEC@1.8.4
	bitbank2/bb_epaper@2.1.9
;	https://github.com/bitbank2/bb_epaper.git#5aaf81fddec42c7775b0599e80808498aee3168b

; Dependencies for all device builds
[deps_app]
lib_deps =
	${deps_common.lib_deps}
	bitbank2/bb_scd41@1.3.2
	https://github.com/bitbank2/bb_temperature.git#20ed72ee5a8db05c0ac23b68d6d601a537aee9ae
	ESP32Async/ESPAsyncWebServer@3.7.7
    https://github.com/thijse/Arduino-Log.git#3f4fcf5a345c1d542e56b88c0ffcb2bd2a5b0bd0

;       =============================
;	Shared configuration (global)
;       =============================

[env]
framework = arduino, espidf
platform = espressif32@6.12.0
; platform = espressif32@6.12.0
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
check_tool = clangtidy
check_flags =
	clangtidy: --checks=bugprone-*,portability-*,clang-analyzer-*,google-*,-google-readability-*
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 460800
build_type = debug


;       =================
;	Test environments
;       =================

[env:native]
framework =
platform = native
test_framework = unity
test_ignore = integration/*
# shared test helpers (e.g. MemoryPersistence) live in test/common/, picked up as a library:
lib_extra_dirs = test
lib_deps =
	${deps_common.lib_deps}
	fabiobatsilva/ArduinoFake@0.4.0
build_flags =
	-D ARDUINOJSON_ENABLE_ARDUINO_STRING=1
	-std=gnu++11
	# avoids errors about WProgram.h from ArduinoLog:
	-D ARDUINO=111
	# warnings from ArduinoFake w/ MacOS' g++:
	-Wno-missing-template-arg-list-after-template-kw
	# for linux:
	-include stdint.h
lib_compat_mode = off

[env:native-windows]
extends = env:native
build_flags =
	-std=gnu++11
	# avoids errors about WProgram.h from ArduinoLog:
	-D ARDUINO=111
	-include stdint.h
	# for pngdec:
	-Duint=uInt


;	=====================
;	Shared configurations
;	=====================

[env:esp32_base]
extends = deps_app
board_build.partitions = boards/min_spiffs.csv
board_build.filesystem = spiffs
build_flags =
    -I .
	-D CORE_DEBUG_LEVEL=0
lib_ldf_mode = deep
lib_ignore =
	BMA530_SensorAPI
	IQS323
	trmnl_x
	BQ27427
debug_init_break = break setup

[env:esp32-c3-devkitc-02]
extends = env:esp32_base
board = esp32-c3-devkitc-02
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
board_build.flash_mode = qio
build_flags =
	${env:esp32_base.build_flags} ; Inherit base flags
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0
debug_tool = esp-builtin

[env:esp32dev]
extends = env:esp32_base
board = esp32dev
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L ; Assuming 80MHz flash freq for generic ESP32, adjust if needed
board_build.flash_mode = dio    ; Common flash mode for ESP32dev

 
;	====================
;	Board configurations
;	====================

[env:waveshare-esp32-driver]
extends = env:esp32dev
extra_scripts = pre:scripts/extra/git_version.py
build_flags =
	${env:esp32_base.build_flags}
	-D BOARD_WAVESHARE_ESP32_DRIVER

[env:trmnl]
extends = env:esp32-c3-devkitc-02
board_build.esp-idf.sdkconfig_path = sdkconfigs/sdkconfig.${this.__env__}
extra_scripts =
	pre:scripts/extra/git_version.py
	post:scripts/extra/post_build_og.py
custom_include_git_hash = ${sysenv.INCLUDE_GIT_HASH_IN_VERSION_NUMBER}
build_flags =
	${env:esp32_base.build_flags}
	-D BOARD_TRMNL
	-D PNG_MAX_BUFFERED_PIXELS=6432
	-D DEVICE_MODEL=\"og\"

; board_build.embed_txtfiles =
;     managed_components/espressif__esp_insights/server_certs/https_server.crt
;   	managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
;     managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
;     managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

; On-device integration test env for TRMNL OG (ESP32-C3).
[env:trmnl_test]
extends = env:trmnl
extra_scripts = pre:scripts/extra/git_version.py
framework = arduino ; espidf causes conflicts with PlatformIO's Unity test framework
test_framework = unity
test_filter = integration/*
test_speed = 115200
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
build_flags =
	${env:trmnl.build_flags}
	-I test/integration
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D DEVICE_MODEL=\"og\"
	-D UNITY_INCLUDE_CONFIG_H
	-include test_config.h

