name: integration

# Boots real builds in trmnl-sim against mock TRMNL servers and checks them with the RSpec
# suite in spec/ (see spec/README.md). Called from build.yml, whose build-integration job uploads
# the firmware it tests (the integration-builds artifact).

on:
  workflow_call:

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    defaults:
      run:
        working-directory: spec

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: spec

      # Style, and the specs load and their metadata is valid for every device (no firmware needed).
      - name: rubocop, dry run
        run: bundle exec rake check

  integration:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: trmnl
            envs: "trmnl:full"
          # The X's own specs and the full general suite take well over half an hour on a 4-vCPU
          # runner, and the load trips wall-clock waits: one example per area instead.
          - env: TRMNL_X
            envs: "TRMNL_X:smoke"
          - env: trmnl_4clr # BWRY
            envs: "trmnl_4clr"

    name: integration (${{ matrix.env }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # The firmware build-integration built (build.yml), into .pio/build/<env> where the specs look.
      - uses: actions/download-artifact@v7
        with:
          name: integration-builds
          path: .pio/build

      # The latest headless release; it finds the chips' ROM ELFs in the rom/ next to it.
      - name: Download trmnl-sim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/trmnl-sim"
          cd "$RUNNER_TEMP/trmnl-sim"
          gh release download -R usetrmnl/trmnl-sim -p '*-linux-x86_64-headless.tar.gz' -p SHA256SUMS.txt
          sha256sum --check --ignore-missing SHA256SUMS.txt
          ls trmnl-sim-*-linux-x86_64-headless.tar.gz
          tar xzf trmnl-sim-*-linux-x86_64-headless.tar.gz --strip-components=1
          echo "SIM_BIN=$PWD/trmnl-sim" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: spec

      - name: Integration tests
        working-directory: spec
        env:
          ENVS: ${{ matrix.envs }}
          # The setup cache (spec/tmp/spec-cache) starts empty, so every setup flow still runs in
          # full, but once per run: the workers share it instead of each redoing it (NO_CACHE=1),
          # which on the X (the factory flow and onboarding) costs minutes per example.
        run: bundle exec rake spec

      - name: Collect screen diffs
        if: failure()
        run: |
          mkdir -p spec/out/artifacts
          find spec/golden -name '*.actual.png' -exec cp {} spec/out/artifacts/ \; || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: simulator-logs-and-screens-${{ matrix.env }}
          path: spec/out/artifacts/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: firmware-coverage-${{ matrix.env }}
          path: |
            spec/out/cov/merged.info
            spec/out/cov/html/
          if-no-files-found: ignore
