name: integration

# Builds the firmware, boots it in trmnl-sim against mock TRMNL servers and checks it with the
# RSpec suite in spec/ (see spec/README.md): one job per env, each building only its own.
# Called from build.yml.

on:
  workflow_call:

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    defaults:
      run:
        working-directory: spec

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: spec

      # Style, and the specs load and their metadata is valid for every device (no firmware needed).
      - name: rubocop, dry run
        run: bundle exec rake check

  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: trmnl
            envs: "trmnl:full"
          # The X's own specs and the full general suite take well over half an hour on a 4-vCPU
          # runner, and the load trips wall-clock waits: one example per area instead.
          - env: TRMNL_X
            envs: "TRMNL_X:smoke"
          - env: trmnl_4clr # BWRY
            envs: "trmnl_4clr"

    name: integration (${{ matrix.env }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # Each env caches its own PlatformIO core: TRMNL_X's platform (pioarduino) and espressif32
      # 6.x install different packages under the same names (see prepare_release.sh).
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            ~/.buildcache
          key: ${{ runner.os }}-pio-integration-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-integration-${{ matrix.env }}-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          job-summary: "" # disabled

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio==6.1.19

      - name: Configure ccache for PlatformIO
        run: |
          echo "PLATFORMIO_BUILD_CACHE_DIR=$HOME/.buildcache" >> $GITHUB_ENV

      # Into .pio/build/<env>, where the specs look. TRMNL_X also fetches its filesystem image
      # (with the ESP32-C5 modem firmware) in post_build_x.py.
      - name: build (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }} -j 4 -v

      # The latest headless release; it finds the chips' ROM ELFs in the rom/ next to it.
      - name: Download trmnl-sim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/trmnl-sim"
          cd "$RUNNER_TEMP/trmnl-sim"
          gh release download -R usetrmnl/trmnl-sim -p '*-linux-x86_64-headless.tar.gz' -p SHA256SUMS.txt
          sha256sum --check --ignore-missing SHA256SUMS.txt
          ls trmnl-sim-*-linux-x86_64-headless.tar.gz
          tar xzf trmnl-sim-*-linux-x86_64-headless.tar.gz --strip-components=1
          echo "SIM_BIN=$PWD/trmnl-sim" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: spec

      - name: Integration tests
        working-directory: spec
        env:
          ENVS: ${{ matrix.envs }}
          # The setup cache (spec/tmp/spec-cache) starts empty, so every setup flow still runs in
          # full, but once per run: the workers share it instead of each redoing it (NO_CACHE=1),
          # which on the X (the factory flow and onboarding) costs minutes per example.
        run: bundle exec rake spec

      - name: Collect screen diffs
        if: failure()
        run: |
          mkdir -p spec/out/artifacts
          find spec/golden -name '*.actual.png' -exec cp {} spec/out/artifacts/ \; || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: simulator-logs-and-screens-${{ matrix.env }}
          path: spec/out/artifacts/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: firmware-coverage-${{ matrix.env }}
          path: |
            spec/out/cov/merged.info
            spec/out/cov/html/
          if-no-files-found: ignore
