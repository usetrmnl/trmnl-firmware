name: build

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The firmware itself is built by the integration jobs, one env each, before they test it.
  build-test:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        id: packages-cache
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - uses: actions/cache/restore@v6
        with:
          path: ~/.buildcache
          key: ${{ runner.os }}-pio-build-cache-native-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pio-build-cache-native-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio==6.1.19

      - name: Generate branding headers
        run: python scripts/generate_branding.py

      - name: Configure the PlatformIO build cache
        run: |
          echo "PLATFORMIO_BUILD_CACHE_DIR=$HOME/.buildcache" >> $GITHUB_ENV

      - name: Display PlatformIO Information
        run: |
          pio system info
          g++ --version
          gcc --version

      - name: test
        run: pio test -e native -v

      # Saved on main only, as in integration.yml.
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.packages-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.buildcache
          key: ${{ runner.os }}-pio-build-cache-native-${{ github.sha }}

      - name: static analysis
        run: pio check --skip-packages --fail-on-defect high

  branding-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Stock config produces stock branding
        run: |
          python scripts/generate_branding.py
          grep -q '"TRMNL"' include/branding.h

      - name: Local override applies without touching tracked files
        run: |
          python scripts/generate_branding.py
          cp lib/wificaptive/src/WifiCaptivePage.h /tmp/portal_stock.h
          printf 'branding:\n  device_name: "Timeframe"\n  accent_color: "#123456"\n' > config.local.yml
          python scripts/generate_branding.py
          grep -q '"Timeframe"' include/branding.h
          # Overriding branding must change the (deterministic) portal page.
          if cmp -s /tmp/portal_stock.h lib/wificaptive/src/WifiCaptivePage.h; then
            echo "portal page did not change on override" >&2; exit 1
          fi
          rm config.local.yml
          # branding.h, QR headers and WifiCaptivePage.h are git-ignored build
          # artifacts, so overriding config must not modify or add any tracked file.
          git diff --exit-code
          test -z "$(git status --porcelain)"

  integration:
    uses: ./.github/workflows/integration.yml

  # The simulator sends display transfers natively; on main, also run IDF's display driver
  # (its interrupt and callback context), without slowing pull requests.
  integration-idf-lcd-driver:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/integration.yml
    with:
      sim_extra_args: --no-hle-lcd

  publish-engineering-build:
    needs: [build-test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/publish-firmware.yml
    with:
      include_git_hash_in_firmware_version: true
      filename_suffix_type: git_short_hash

  publish-tagged-build:
    needs: [build-test, integration]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-firmware.yml
    with:
      include_git_hash_in_firmware_version: false
      filename_suffix_type: git_tag

  publish-dev-builds:
    needs: [build-test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/publish-dev-firmware.yml
    secrets: inherit
