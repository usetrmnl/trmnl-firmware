name: build

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The firmware itself is built by the integration jobs, one env each, before they test it.
  build-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            ~/.buildcache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-${{ hashFiles('platformio.ini') }}
          job-summary: "" # disabled

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio==6.1.19

      - name: Configure ccache for PlatformIO
        run: |
          echo "PLATFORMIO_BUILD_CACHE_DIR=$HOME/.buildcache" >> $GITHUB_ENV

      - name: Display PlatformIO Information
        run: |
          pio system info
          g++ --version
          gcc --version

      - name: test
        run: pio test -e native -v

      - name: static analysis
        run: pio check --skip-packages --fail-on-defect high

  integration:
    uses: ./.github/workflows/integration.yml

  publish-engineering-build:
    needs: [build-test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/publish-firmware.yml
    with:
      include_git_hash_in_firmware_version: true
      filename_suffix_type: git_short_hash

  publish-tagged-build:
    needs: [build-test, integration]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-firmware.yml
    with:
      include_git_hash_in_firmware_version: false
      filename_suffix_type: git_tag

  publish-dev-builds:
    needs: [build-test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/publish-dev-firmware.yml
    secrets: inherit
