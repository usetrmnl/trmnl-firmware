name: publish-release-firmware

# Publishes a tagged release: builds the selected environments via
# scripts/prepare_release.sh, uploads the full-flash bins (plus OTA bins for
# the models in OTA_SLUGS; BYOD builds are flash-only) to S3, and records draft
# Firmware/FlashFirmware releases in the TRMNL web app for an admin to
# promote/publish.
#
# Idempotent: already-uploaded S3 objects are skipped (unless overwrite is
# set) and the admin API upserts, so a failed run can safely be re-run.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.8.15)"
        required: true
        type: string
      force:
        description: "Bypass prepare_release.sh's HEAD commit message check"
        type: boolean
        default: false
      overwrite:
        description: "Re-upload files that already exist in S3"
        type: boolean
        default: false
      # One checkbox per env (workflow_dispatch has no multi-select input type).
      # Inputs must be named build_<pio env>; each env also needs an S3_PREFIXES entry.
      build_trmnl:
        description: "Build trmnl (OG)"
        type: boolean
        default: true
      build_trmnl_4clr:
        description: "Build trmnl_4clr (BWRY)"
        type: boolean
        default: true
      build_TRMNL_X:
        description: "Build TRMNL_X"
        type: boolean
        default: true
      build_TRMNL_7inch5_OG_DIY_Kit:
        description: "Build TRMNL_7inch5_OG_DIY_Kit (BYOD)"
        type: boolean
        default: false
      build_seeed_xiao_esp32c3:
        description: "Build seeed_xiao_esp32c3 (BYOD)"
        type: boolean
        default: false
      build_seeed_reTerminal_E1001:
        description: "Build seeed_reTerminal_E1001 (BYOD)"
        type: boolean
        default: false
      build_seeed_reTerminal_E1002:
        description: "Build seeed_reTerminal_E1002 (BYOD)"
        type: boolean
        default: false
      build_TRMNL_X_E1003:
        description: "Build TRMNL_X_E1003 (BYOD)"
        type: boolean
        default: false
      build_xteink_x4:
        description: "Build xteink_x4 (BYOD)"
        type: boolean
        default: false
      build_xteink_x3:
        description: "Build xteink_x3 (BYOD)"
        type: boolean
        default: false
      build_seeed_sticky:
        description: "Build seeed_sticky (BYOD)"
        type: boolean
        default: false

concurrency:
  group: publish-release-firmware
  cancel-in-progress: false

env:
  S3_BUCKET: trmnl-fw
  S3_BASE_URL: https://trmnl-fw.s3.us-east-2.amazonaws.com

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Verify tag matches firmware version
        run: |
          MAJOR=$(awk '/#define FW_MAJOR_VERSION/ {print $3}' include/config.h)
          MINOR=$(awk '/#define FW_MINOR_VERSION/ {print $3}' include/config.h)
          PATCH=$(awk '/#define FW_PATCH_VERSION/ {print $3}' include/config.h)
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if [[ "${{ inputs.tag }}" != "v${VERSION}" ]]; then
            echo "::error::Tag '${{ inputs.tag }}' does not match firmware version v${VERSION} in include/config.h"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Select environments
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          ENVS=$(jq -r 'to_entries[]
            | select((.key | startswith("build_")) and (.value == true or .value == "true"))
            | .key | ltrimstr("build_")' <<<"$INPUTS" | xargs)
          if [[ -z "$ENVS" ]]; then
            echo "::error::No environments selected"
            exit 1
          fi
          echo "Selected environments: ${ENVS}"
          echo "ENVS=${ENVS}" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio==6.1.19 esptool

      - name: Build release firmware
        env:
          INCLUDE_GIT_HASH_IN_VERSION_NUMBER: "false"
          # Separate PlatformIO core dir per platform (see prepare_release.sh)
          PIO_CORE_ROOT: ${{ runner.temp }}/pio-cores
        run: ./scripts/prepare_release.sh ${{ inputs.force && '--force' || '' }} ${ENVS}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to S3 and record draft releases in TRMNL
        env:
          TRMNL_ADMIN_API_TOKEN: ${{ secrets.TRMNL_ADMIN_API_TOKEN }}
          OVERWRITE: ${{ inputs.overwrite }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # PlatformIO env -> S3 prefix (must cover every build_<env> input)
          declare -A S3_PREFIXES=(
            [trmnl]=trmnl_og
            [trmnl_4clr]=trmnl_bwry
            [TRMNL_X]=trmnl_x
            [TRMNL_7inch5_OG_DIY_Kit]=byod/seeed_OG_DIY_Kit
            [seeed_xiao_esp32c3]=byod/seeed_xiao_esp32c3
            [seeed_reTerminal_E1001]=byod/seeed_E1001
            [seeed_reTerminal_E1002]=byod/seeed_E1002
            [TRMNL_X_E1003]=byod/seeed_E1003
            [xteink_x4]=byod/xteink_x4
            [xteink_x3]=byod/xteink_x3
            [seeed_sticky]=byod/seeed_sticky
          )
          # S3 prefixes that get OTA updates; all others (BYOD) are flash-only
          OTA_SLUGS=" trmnl_og trmnl_x trmnl_bwry "
          FILE="FW${VERSION}.bin"

          upload() { # <local file> <s3 key>
            if [[ "$OVERWRITE" != "true" ]] && aws s3api head-object --bucket "$S3_BUCKET" --key "$2" >/dev/null 2>&1; then
              echo "Skipping (already in S3): $2"
            else
              aws s3 cp "$1" "s3://${S3_BUCKET}/$2"
            fi
          }

          echo "## 🚀 Release ${TAG}" >> "$GITHUB_STEP_SUMMARY"

          for pio_env in ${ENVS}; do
            slug=${S3_PREFIXES[$pio_env]:-}
            if [[ -z "$slug" ]]; then
              echo "::error::No S3 prefix configured for ${pio_env}"
              exit 1
            fi
            flash_src=".pio/release/${pio_env}/flash/${FILE}"
            flash_key="${slug}/flash/${FILE}"

            upload "$flash_src" "$flash_key"

            jq -n \
              --arg version "$VERSION" \
              --arg tag "$TAG" \
              --arg flash_url "${S3_BASE_URL}/${flash_key}" \
              --argjson flash_size "$(stat -c%s "$flash_src")" \
              '{
                version: $version,
                tag: $tag,
                flash: { url: $flash_url, size: $flash_size }
              }' > payload.json

            summary="### ${slug}"$'\n'

            if [[ "$OTA_SLUGS" == *" ${slug} "* ]]; then
              ota_src=".pio/release/${pio_env}/ota/${FILE}"
              ota_key="${slug}/${FILE}"

              upload "$ota_src" "$ota_key"

              jq \
                --arg ota_url "${S3_BASE_URL}/${ota_key}" \
                --argjson ota_size "$(stat -c%s "$ota_src")" \
                '. + { ota: { url: $ota_url, size: $ota_size } }' payload.json > payload.tmp
              mv payload.tmp payload.json

              summary+="- OTA: \`${S3_BASE_URL}/${ota_key}\` ($(stat -c%s "$ota_src") bytes)"$'\n'
            fi

            summary+="- Flash: \`${S3_BASE_URL}/${flash_key}\` ($(stat -c%s "$flash_src") bytes)"

            echo "Recording draft release for ${slug}:"
            curl --fail-with-body -sS -X POST \
              -H "Access-Token: ${TRMNL_ADMIN_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @payload.json \
              https://trmnl.com/admin_api/firmware_releases
            echo

            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Draft FlashFirmware (and OTA Firmware, where applicable) records created — promote/publish them in the admin." >> "$GITHUB_STEP_SUMMARY"
